subdir: fleet_policy
description: "For administrators who pin settings through the managed scope: records what each agent role really sends to the provider (model, reasoning effort, service tier, plus the tier the provider says it served) next to the managed-scope state and the effective config (`hermes fleet-policy status --json`); measures cron cost per job — runs, empty runs, $/day, gate present (`crons --cost`); and `watch`, a generic wake gate for cron scripts that replays one read tool on an MCP server and wakes the agent only when new item ids appear (stock `wakeAgent` gate, no LLM call otherwise). Ships two skills (managed-scope admin, recurring tasks). Disclosure — observes request metadata through the public `pre_api_request` / `pre_auxiliary_call` hooks and a pass-through `llm_execution` middleware, never message content or credentials, stored in $HERMES_HOME/fleet-policy/; reads cron/executions.db and state.db read-only; `watch` calls only the MCP endpoint written in its config (or the one an admin pins via `watch_server_url`) and stores seen ids in its state file; no other network access, no telemetry."
maintainer: Julientalbot
tier: community
category: automation
requires_hermes: ">=0.21.5"
